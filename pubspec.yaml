name: unique_social_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^10.1.4
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  image_picker: ^1.2.3
  camera: ^0.11.2+1
  photo_manager: ^3.11.0
  video_player: ^2.13.0
  video_thumbnail:
    path: packages/video_thumbnail
  firebase_auth: ^6.5.6
  http: ^1.6.0
  just_audio: ^0.10.5
  flutter_image_compress: ^2.4.0
  photo_manager_image_provider: ^2.2.0
  perfect_freehand: ^2.5.2+1
  image_cropper: ^12.2.1
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
